name: Pre-release APK (manual)

# Manually triggered only. Rebuilds the patched APK from original/base.apk + patches/ + src/,
# signs it with the universal key stored in repository secrets and publishes a GitHub pre-release.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Extra release notes (optional)"
        required: false
        default: ""
      package_suffix:
        description: "OPTIONAL diagnostic build: leave EMPTY for the normal build. Enter .diag for a side-by-side copy (application id com.cgs.atvobserver.diag, label 'J3 ATV Observer DIAG', updater disabled, release title marked DIAG). See docs/INSTALL_TROUBLESHOOTING.md"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  build-and-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOOLS_DIR: ${{ github.workspace }}/.tools
      OUT_DIR: ${{ github.workspace }}/out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache build tools (apktool, baksmali, build-tools 34, android.jar)
        uses: actions/cache@v4
        with:
          path: .tools
          key: atv-tools-apktool2.12.0-bt34-android34-baksmali3.0.3

      - name: Compute version
        id: ver
        env:
          PACKAGE_SUFFIX: ${{ github.event.inputs.package_suffix }}
        run: |
          # versionCode = 100 + run number: always above the owner-pinned release v1.1.7 (versionCode 17)
          # and strictly growing, so the in-app updater (docs/IN_APP_UPDATER.md) and Android's
          # "no downgrade" rule both see every later build as newer. The tag is unique per run.
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [ -n "$PACKAGE_SUFFIX" ]; then
            # DIAG: the tag/file name must not look like a normal "-ci.<run>" release (the in-app updater of
            # the normal app derives a versionCode from such tags) and must differ from every normal build.
            echo "name=1.1.7-Mk1-pocketfix-ci.${GITHUB_RUN_NUMBER}-diag" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.1.7-Mk1-pocketfix-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore universal signing key from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/universal.p12"
          chmod 600 "$RUNNER_TEMP/universal.p12"

      - name: Build, patch, sign
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/universal.p12
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          PACKAGE_SUFFIX: ${{ github.event.inputs.package_suffix }}   # empty = normal build, unchanged
        run: ./scripts/build.sh

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/universal.p12"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          EXTRA_NOTES: ${{ github.event.inputs.release_notes }}
          PACKAGE_SUFFIX: ${{ github.event.inputs.package_suffix }}
        run: |
          APK="out/j3-atv-observer-${VERSION_NAME}.apk"
          # the versionCode advertised to the in-app updater must be the one inside the APK
          grep -q "versionCode='${VERSION_CODE}'" build/badging.txt || { echo "::error::APK versionCode differs from ${VERSION_CODE}"; exit 1; }
          CERT=$(grep -m1 "certificate SHA-256" build/verify.txt | sed 's/.*: //')
          SHA=$(cut -d' ' -f1 "${APK}.sha256")
          if [ -n "$PACKAGE_SUFFIX" ]; then
            # ---- DIAG variant: side-by-side diagnostic copy, NOT an update of the normal app.
            # Deliberately has no "J3ATV-VersionCode:" marker, no "- versionName: `..`, versionCode: `..`"
            # line and no "-ci.<run>" tag, so the in-app updater of the normal app ignores this release.
            DIAG_PKG="com.cgs.atvobserver${PACKAGE_SUFFIX}"
            grep -q "^package: name='${DIAG_PKG}' " build/badging.txt || { echo "::error::APK package is not ${DIAG_PKG}"; exit 1; }
            {
              echo "**DIAG - diagnostic side-by-side build. Not an update of J3 ATV Observer.**"
              echo
              echo "Installs next to the normal app under the application id \`${DIAG_PKG}\` with the launcher label \"J3 ATV Observer DIAG\"."
              echo "Its in-app updater is disabled. Purpose: find out why Android answers \"App not installed as package conflicts with an existing package\"."
              echo
              echo "- DIAG installs, the normal app does not: a ghost copy of \`com.cgs.atvobserver\` is still registered on the device."
              echo "- DIAG fails with the same message too: device / installer / policy problem - use \`adb install\` for the real error code."
              echo "- Details: docs/INSTALL_TROUBLESHOOTING.md in the repository."
              echo
              echo "Build data:"
              echo "- application id: \`${DIAG_PKG}\`"
              echo "- version name \`${VERSION_NAME}\`, version code \`${VERSION_CODE}\`"
              echo "- commit: \`${GITHUB_SHA}\`"
              echo "- signing certificate SHA-256: \`${CERT}\` (universal key)"
              echo "- APK SHA-256: \`${SHA}\`"
              echo
              echo "Not tested on physical devices by CI."
              [ -z "$EXTRA_NOTES" ] || { echo; echo "$EXTRA_NOTES"; }
            } > notes.md
            ! grep -qi "J3ATV-VersionCode" notes.md   # must stay invisible to the normal app's updater
            TITLE="DIAG - J3 ATV Observer ${VERSION_NAME} (side-by-side diagnostic pre-release)"
          else
            {
              echo "Automated pre-release build of J3 ATV Observer (patched from v1.1.6-Mk1)."
              echo
              echo "- versionName: \`${VERSION_NAME}\`, versionCode: \`${VERSION_CODE}\`"
              echo "- APK asset: \`${APK##*/}\` (+ \`.sha256\`), installed by the in-app updater only after the digest matches"
              echo "- commit: \`${GITHUB_SHA}\`"
              echo "- signing certificate SHA-256: \`${CERT}\` (universal key)"
              echo "- APK SHA-256: \`${SHA}\`"
              echo
              echo "First install over the original app: uninstall the old app first (different signing key)."
              echo "Later builds from this workflow update in place."
              echo
              echo "Not tested on physical devices by CI."
              echo
              echo "Machine-readable (read by the in-app updater, keep on its own line):"
              echo "J3ATV-VersionCode: ${VERSION_CODE}"
              [ -z "$EXTRA_NOTES" ] || { echo; echo "$EXTRA_NOTES"; }
            } > notes.md
            grep -qx "J3ATV-VersionCode: ${VERSION_CODE}" notes.md
            TITLE="J3 ATV Observer ${VERSION_NAME} (pre-release)"
          fi
          gh release create "v${VERSION_NAME}" "$APK" "${APK}.sha256" \
            --prerelease --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md
